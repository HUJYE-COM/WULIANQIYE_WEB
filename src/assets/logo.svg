<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">无良资本家卡通标志</title>
  <desc id="desc">戴礼帽、抱着钱袋露出贪婪笑容的卡通资本家，左上角贴有无良标签。</desc>

  <defs>
    <linearGradient id="bg" x1="70" y1="38" x2="446" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE99A"/>
      <stop offset="1" stop-color="#F2A443"/>
    </linearGradient>
    <linearGradient id="suit" x1="161" y1="294" x2="367" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D3A50"/>
      <stop offset="1" stop-color="#171621"/>
    </linearGradient>
    <linearGradient id="moneyBag" x1="280" y1="337" x2="423" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6CA4F"/>
      <stop offset="1" stop-color="#C17B17"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6F3218" flood-opacity=".28"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#461F18" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- Badge background -->
  <circle cx="256" cy="264" r="222" fill="url(#bg)"/>
  <circle cx="256" cy="264" r="222" fill="none" stroke="#522719" stroke-width="13"/>
  <path d="M71 331c53 20 79 7 107-10 32-20 61-14 91 5 34 22 72 20 105-3 26-19 48-18 68-11" fill="none" stroke="#FFF2C9" stroke-width="12" stroke-linecap="round" opacity=".55"/>

  <!-- “无良” label -->
  <g transform="rotate(-10 102 102)" filter="url(#smallShadow)">
    <path d="M31 61h136v78H31z" fill="#E73B32" stroke="#522719" stroke-width="8" stroke-linejoin="round"/>
    <path d="m167 75 25 25-25 25z" fill="#E73B32" stroke="#522719" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="50" cy="100" r="7" fill="#FFE7B0"/>
    <text x="71" y="117" fill="#FFF8E5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="900" letter-spacing="3">无良</text>
  </g>

  <!-- Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <ellipse cx="161" cy="246" rx="32" ry="42" fill="#F2A26E" stroke="#522719" stroke-width="9"/>
    <ellipse cx="351" cy="246" rx="32" ry="42" fill="#F2A26E" stroke="#522719" stroke-width="9"/>
    <path d="M153 246c9-14 22-11 22 4" fill="none" stroke="#B95F47" stroke-width="7" stroke-linecap="round"/>
    <path d="M359 246c-9-14-22-11-22 4" fill="none" stroke="#B95F47" stroke-width="7" stroke-linecap="round"/>

    <!-- Head and cheeks -->
    <path d="M172 177c18-42 55-58 88-57 45 1 78 25 88 69l-8 88c-6 55-38 84-84 84-47 0-78-30-85-84z" fill="#F3AA73" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="203" cy="281" rx="35" ry="27" fill="#EF8E67" opacity=".68"/>
    <ellipse cx="310" cy="281" rx="35" ry="27" fill="#EF8E67" opacity=".68"/>

    <!-- Top hat -->
    <path d="M190 166 201 70c2-15 16-25 31-23l77 9c14 2 24 15 22 30l-12 101z" fill="#24212E" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>
    <path d="m196 125 129 15-6 47-129-15z" fill="#A82F35"/>
    <path d="M161 160c2-16 17-27 33-25l147 18c16 2 27 16 25 32s-17 27-33 25l-147-18c-16-2-27-16-25-32Z" fill="#24212E" stroke="#522719" stroke-width="10"/>
    <path d="M211 81c24-7 55-4 82 8" fill="none" stroke="#4E485D" stroke-width="8" stroke-linecap="round"/>

    <!-- Brows -->
    <path d="M187 211c17-17 39-17 57-5" fill="none" stroke="#522719" stroke-width="12" stroke-linecap="round"/>
    <path d="M325 215c-17-18-38-19-57-7" fill="none" stroke="#522719" stroke-width="12" stroke-linecap="round"/>

    <!-- Greedy eyes -->
    <ellipse cx="220" cy="236" rx="25" ry="28" fill="#FFF9E9" stroke="#522719" stroke-width="8"/>
    <ellipse cx="293" cy="238" rx="25" ry="28" fill="#FFF9E9" stroke="#522719" stroke-width="8"/>
    <text x="208" y="250" fill="#3B8B48" font-family="Arial, sans-serif" font-size="35" font-weight="900">$</text>
    <text x="281" y="252" fill="#3B8B48" font-family="Arial, sans-serif" font-size="35" font-weight="900">$</text>

    <!-- Nose -->
    <path d="M256 238c-6 14-13 32-7 42 5 8 17 8 26 1" fill="none" stroke="#B85D45" stroke-width="8" stroke-linecap="round"/>

    <!-- Moustache -->
    <path d="M257 291c-18-15-42-12-54 7 13 16 39 18 55 3 17 16 44 15 56-2-13-19-38-22-57-8Z" fill="#4B271E" stroke="#522719" stroke-width="5" stroke-linejoin="round"/>

    <!-- Greedy grin -->
    <path d="M213 309c26 36 66 38 91 2-11 51-77 54-91-2Z" fill="#7D241F" stroke="#522719" stroke-width="8" stroke-linejoin="round"/>
    <path d="M226 321c19 15 43 16 62 0" fill="none" stroke="#FFF5D9" stroke-width="14" stroke-linecap="round"/>

    <!-- Body / suit -->
    <path d="M164 462c4-68 19-107 61-124h63c43 17 59 56 62 124z" fill="url(#suit)" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>
    <path d="m223 340 33 42 33-42-12 78h-42z" fill="#FFF3D2" stroke="#522719" stroke-width="7" stroke-linejoin="round"/>
    <path d="m256 381-21 27 21 22 21-22z" fill="#B92F38" stroke="#522719" stroke-width="6"/>
    <path d="m222 341-34 26 49 72 19-57zM290 341l34 26-49 72-19-57z" fill="#302D3B" stroke="#522719" stroke-width="7" stroke-linejoin="round"/>

    <!-- Arms hugging the money bag -->
    <path d="M201 389c-32-4-53 14-56 42-3 25 18 38 48 26l55-22-12-35z" fill="#F3AA73" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>
    <path d="M328 387c31-5 54 12 58 40 4 25-17 39-47 28l-56-20 11-36z" fill="#F3AA73" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>

    <!-- Money bag -->
    <path d="M299 350c13-17 20-29 17-42 22 9 43 9 64-1-5 15 2 29 18 44-7 9-21 14-49 14-27 0-42-5-50-15Z" fill="#E8B73D" stroke="#522719" stroke-width="9" stroke-linejoin="round"/>
    <path d="M302 357c-20 18-37 50-31 80 6 31 34 46 78 46 45 0 74-15 79-47 5-30-12-61-33-79-29 10-62 10-93 0Z" fill="url(#moneyBag)" stroke="#522719" stroke-width="10" stroke-linejoin="round"/>
    <path d="M302 357c28 10 63 10 93 0" fill="none" stroke="#522719" stroke-width="9" stroke-linecap="round"/>
    <text x="314" y="449" fill="#6B4014" font-family="Arial, sans-serif" font-size="79" font-weight="900">$</text>

    <!-- Hands -->
    <path d="M213 404c18-7 35 5 33 25-2 18-25 28-45 30" fill="#F3AA73" stroke="#522719" stroke-width="9" stroke-linecap="round"/>
    <path d="M301 404c-18-7-35 5-33 25 2 18 25 28 45 30" fill="#F3AA73" stroke="#522719" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Small decorative coins -->
  <g fill="#FFD95E" stroke="#522719" stroke-width="6">
    <circle cx="104" cy="282" r="18"/>
    <circle cx="414" cy="247" r="15"/>
    <circle cx="114" cy="376" r="12"/>
  </g>
  <g fill="#805016" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="104" y="291" font-size="26">$</text>
    <text x="414" y="255" font-size="22">$</text>
    <text x="114" y="383" font-size="18">$</text>
  </g>
</svg>
